name: McQqBridge
version: 1.1.0
main: com.mcqqbridge.McQqBridgePlugin
api-version: '1.21'
description: Bridge MC chat with QQ official bot
commands:
  mcqq:
    description: McQqBridge management commands
    usage: /mcqq <status|mode|bridge|format|bind|unbind|report|map|trail|terrain|ai|qq|reload>
permissions:
  mcqq.admin:
    description: Allows using /mcqq commands
    default: op
